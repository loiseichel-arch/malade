# Builds the plugin on GitHub Macs and a GitHub Windows PC at every push (or
# by hand from the Actions tab) and publishes them as downloads:
#   Mac     : VST3, AU, AAX, Standalone (universal, macOS 11+)
#   Windows : VST3, AAX, Standalone (64-bit)

name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Two kinds of GitHub Mac: whichever is free first delivers. Both make a
    # universal plugin (Apple Silicon + Intel).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build (Release, universal)
        run: cmake --build build --config Release --parallel -- -quiet

      - name: Check every plugin is universal and runs on macOS 11+
        run: |
          set -e
          R=build/Malade_artefacts/Release
          fail=0
          for b in "$R/VST3/Malade.vst3" "$R/AU/Malade.component" "$R/AAX/Malade.aaxplugin" "$R/Standalone/Malade.app"; do
            [ -d "$b" ] || continue
            bin="$b/Contents/MacOS/Malade"
            archs=$(lipo -archs "$bin")
            minos=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$b/Contents/Info.plist" 2>/dev/null || echo "?")
            echo "$(basename "$b"): archs=[$archs] minimum macOS=$minos"
            case "$archs" in *arm64*) ;; *) echo "::error::$(basename "$b") has no Apple Silicon (arm64) code"; fail=1;; esac
            case "$archs" in *x86_64*) ;; *) echo "::error::$(basename "$b") has no Intel (x86_64) code"; fail=1;; esac
            [ "$minos" = "11.0" ] || { echo "::error::$(basename "$b") needs macOS $minos instead of 11.0"; fail=1; }
          done
          exit $fail

      - name: Sign ad hoc and package
        run: |
          set -e
          R=build/Malade_artefacts/Release
          mkdir -p out
          for b in "$R/VST3/Malade.vst3" "$R/AU/Malade.component" "$R/AAX/Malade.aaxplugin" "$R/Standalone/Malade.app"; do
            if [ -d "$b" ]; then
              codesign --force --deep --sign - "$b"
              ditto -c -k --keepParent "$b" "out/$(basename "$b").zip"
            fi
          done
          cp INSTALL_MAC.txt out/
          ls -la out

      - name: Publish the download
        uses: actions/upload-artifact@v4
        with:
          name: Malade-macOS-${{ matrix.runner }}
          path: out/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release, 64-bit)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $R = "build/Malade_artefacts/Release"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($item in @("$R/VST3/Malade.vst3", "$R/AAX/Malade.aaxplugin")) {
            if (Test-Path $item) { Compress-Archive -Path $item -DestinationPath ("out/" + (Split-Path $item -Leaf) + ".zip") -Force }
          }
          if (Test-Path "$R/Standalone/Malade.exe") { Copy-Item "$R/Standalone/Malade.exe" out/ }
          Copy-Item INSTALL_WINDOWS.txt out/
          Get-ChildItem out

      - name: Publish the download
        uses: actions/upload-artifact@v4
        with:
          name: Malade-Windows
          path: out/
          retention-days: 30
