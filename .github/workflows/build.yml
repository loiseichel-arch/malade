# Builds Malade at every push (or by hand from the Actions tab):
#   Mac     : Malade-<version>-mac.dmg  (installer: VST3, AU, AAX, app;
#             universal Apple Silicon + Intel, macOS 11+)
#   Windows : Malade-<version>-windows-setup.exe  (VST3, AAX, app; 64-bit)
# Both are in the "Artifacts" of each run. Pushing a tag like v0.3.0 also
# publishes them on the repository's Releases page, where anyone can
# download them without a GitHub account.

name: Build

on:
  push:
  workflow_dispatch:

env:
  NAME: Malade

jobs:
  build-mac:
    # Two kinds of GitHub Mac: whichever is free first delivers. Both make a
    # universal plugin (Apple Silicon + Intel).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=$(sed -n 's/^project ([A-Za-z]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build (Release, universal)
        run: cmake --build build --config Release --parallel -- -quiet

      - name: Check every plugin is universal and runs on macOS 11+
        run: |
          set -e
          R=build/${NAME}_artefacts/Release
          fail=0
          for b in "$R/VST3/$NAME.vst3" "$R/AU/$NAME.component" "$R/AAX/$NAME.aaxplugin" "$R/Standalone/$NAME.app"; do
            [ -d "$b" ] || continue
            bin="$b/Contents/MacOS/$NAME"
            archs=$(lipo -archs "$bin")
            minos=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$b/Contents/Info.plist" 2>/dev/null || echo "?")
            echo "$(basename "$b"): archs=[$archs] minimum macOS=$minos"
            case "$archs" in *arm64*) ;; *) echo "::error::$(basename "$b") has no Apple Silicon (arm64) code"; fail=1;; esac
            case "$archs" in *x86_64*) ;; *) echo "::error::$(basename "$b") has no Intel (x86_64) code"; fail=1;; esac
            [ "$minos" = "11.0" ] || { echo "::error::$(basename "$b") needs macOS $minos instead of 11.0"; fail=1; }
          done
          exit $fail

      - name: Sign ad hoc
        run: |
          set -e
          R=build/${NAME}_artefacts/Release
          for b in "$R/VST3/$NAME.vst3" "$R/AU/$NAME.component" "$R/AAX/$NAME.aaxplugin" "$R/Standalone/$NAME.app"; do
            [ -d "$b" ] && codesign --force --deep --sign - "$b"
          done

      - name: Make the installer (.dmg)
        run: installer/mac/make_dmg.sh "$NAME" "$VERSION" "build/${NAME}_artefacts/Release" out

      - name: Publish the download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-${{ env.VERSION }}-mac-${{ matrix.runner }}
          path: out/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern '^project \(\w+ VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake -B build -A x64   # newest Visual Studio installed on the runner

      - name: Build (Release, 64-bit)
        run: cmake --build build --config Release --parallel

      - name: Make the installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName "/DName=$env:NAME" "/DVersion=$env:VERSION" "/DSourceDir=$PWD\build\$($env:NAME)_artefacts\Release" "/Oout" installer\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out

      - name: Publish the download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-${{ env.VERSION }}-windows
          path: out/*.exe
          retention-days: 30

  release:
    # Only for a version tag (v0.3.0, ...): put the installers on the
    # Releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Keep one dmg (both Macs build the same universal one)
        run: |
          mkdir -p files
          find dist -name '*.dmg' | head -1 | xargs -I{} cp {} files/
          find dist -name '*.exe' -exec cp {} files/ \;
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
